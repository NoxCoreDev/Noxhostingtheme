# Manifest Blueprint - NOX HOSTING theme
# A verifier avec la documentation Blueprint (blueprintframework.dev) avant installation.
info:
  name: "NOX HOSTING Theme"
  identifier: "noxhosting-theme"
  description: "Theme bleu, noir et blanc pour Pterodactyl, par NoxCoreDev."
  version: "1.0.0"
  target: "beta-2026-08"
  author: "NoxCoreDev"
  icon: "assets/logo.svg"

data:
  - title: "Feuille de style NOX"
    source: "nox-theme.css"
    target: "public/assets/extensions/noxhosting-theme/nox-theme.css"
  - title: "Logo"
    source: "assets/logo.svg"
    target: "public/assets/extensions/noxhosting-theme/logo.svg"
  - title: "Apercu du lien"
    source: "assets/preview.png"
    target: "public/assets/extensions/noxhosting-theme/preview.png"

wrapper:
  - title: "Titre, apercu du lien et feuille de style"
    target: "resources/views/templates/wrapper.blade.php"
    inject: "HEAD"
    content: |
      <title>NOX HOSTING</title>
      <meta property="og:title" content="NOX HOSTING - Pterodactyl theme" />
      <meta property="og:description" content="Hebergement de serveurs, theme NOX HOSTING by NoxCoreDev." />
      <meta property="og:image" content="/assets/extensions/noxhosting-theme/preview.png" />
      <meta name="twitter:card" content="summary_large_image" />
      <link rel="stylesheet" href="/assets/extensions/noxhosting-theme/nox-theme.css" />
